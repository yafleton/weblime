name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
      - name: Website zusammenstellen
        shell: bash
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js .nojekyll _site/
          cp -R css js _site/
      - name: Pages konfigurieren
        uses: actions/configure-pages@v5
      - name: Website hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
